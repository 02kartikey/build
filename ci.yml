## NuMind MAPS CI — save as .github/workflows/ci.yml to enable it.
##
## On every push and pull request to main it:
##   1. installs exactly what package-lock.json pins (npm ci)
##   2. parses every script and loads every server module (npm test)
##   3. starts the server against a throwaway PostgreSQL 16, which creates
##      the whole schema on start, and waits for /health to report ok
##   4. checks the dashboards are served and private files are not
## No secrets are needed: the app token and database are test-only values.

name: NuMind MAPS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Checks and smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: numind
          POSTGRES_PASSWORD: numind-ci
          POSTGRES_DB: numind
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U numind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: numind
      PGPASSWORD: numind-ci
      PGDATABASE: numind
      PGSSL: disable
      PORT: 3000
      APP_TOKEN: ci-only-app-token-not-secret
      LOG_LEVEL: warn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (version from package.json engines)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Parse and load every module
        run: npm test

      - name: Start the server (creates the schema)
        run: |
          node server.js > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health | grep -q '"ok":true'; then echo "Server ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "Server did not become healthy"; cat server.log; exit 1

      - name: Smoke test
        run: |
          set -e
          code() { curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$1"; }
          for page in / /dashboard-admin.html /dashboard-management.html /dashboard-counsellor.html /js/dashboard-flow.js; do
            [ "$(code "$page")" = 200 ] || { echo "Expected 200 for $page"; exit 1; }
          done
          for private in /.env /server.js /package.json /dashboard-db.js; do
            [ "$(code "$private")" = 404 ] || { echo "Expected 404 for $private"; exit 1; }
          done
          [ "$(code /api/dashboard/flow)" = 401 ] || { echo "Dashboard API must require sign-in"; exit 1; }
          echo "Smoke test passed"

      - name: Server log on failure
        if: failure()
        run: cat server.log || true

      - name: Stop the server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true
